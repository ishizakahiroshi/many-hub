name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Test Core without optional SDKs
        run: python -m unittest discover -s tests -v
      - name: Compile source
        run: python -m compileall -q manyhub tests examples
      - name: Run Mock acceptance example
        run: python examples/mock_roundtrip.py
